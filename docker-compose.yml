# Production: pulls the published image. Set OP25TAP_TAG to pin a release.
# To build from source instead: docker compose -f docker-compose.build.yml up -d --build
services:
  op25-tap:
    image: ghcr.io/d3mocide/op25-tap:${OP25TAP_TAG:-latest}
    container_name: op25-tap
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - OP25TAP_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./config:/app/config
