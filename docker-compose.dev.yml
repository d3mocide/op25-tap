services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: op25-tap-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - OP25TAP_DATA_DIR=/app/data
    volumes:
      - ./api:/app/api
      - ./ingest:/app/ingest
      - ./db:/app/db
      - ./config:/app/config
      - ./data:/app/data

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: op25-tap-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Container-internal addresses; host ports come from PORT / FRONTEND_PORT above.
      - VITE_BACKEND_HOST=backend
      - VITE_BACKEND_PORT=8000
      - FRONTEND_PORT=5173
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    depends_on:
      - backend
